# IDs de las cuentas de esta marca. Aqui NO van secretos:
# los tokens viven en .secrets/ y nunca se versionan.

youtube:
  channel_id: ""

facebook:
  page_id: ""

instagram:
  # Debe ser una cuenta Business vinculada a la Pagina de Facebook de arriba.
  ig_user_id: ""
  # Base HTTPS de media suministrada. Con `media transfer`, debe coincidir con
  # media-policy.json del servidor; `media verify --remote --public` verifica
  # los bytes completos (SHA-256, tamaño, MIME), no solo un HEAD 200.
  # Consulta MEDIA-INGESTION.md. Transferir no aprueba ni publica un post.
  media_url_base: ""

tiktok:
  # Se rellena automáticamente al ejecutar `socialcli auth tiktok`: el
  # comando pide el scope user.info.basic y toma el open_id de la propia
  # respuesta del canje de token, sin llamadas adicionales. Si no pudiera
  # obtenerlo (por ejemplo, con un token antiguo pedido sin ese scope), lo
  # avisa por pantalla y hay que rellenarlo a mano -ver SETUP.md, sección
  # TikTok- con GET https://open.tiktokapis.com/v2/user/info/?fields=open_id
  # y la cabecera 'Authorization: Bearer <access_token>' (el que guarda
  # `socialcli auth tiktok` en .secrets/tiktok.json).
  open_id: ""
  # inbox  -> sube al buzon y confirmas en la app (sin auditoria aprobada)
  # direct -> publica solo (SOLO con la auditoria de TikTok aprobada)
  mode: inbox
  auditada: false
