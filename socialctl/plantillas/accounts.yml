# Account identifiers for this brand. Never put secrets here:
# tokens belong in .secrets/ and must never be committed.

youtube:
  channel_id: ""

facebook:
  page_id: ""

instagram:
  # Requires a professional account linked to the Facebook Page above.
  ig_user_id: ""
  # HTTPS base URL for supplied media. With `media transfer`, it must match
  # the server's media-policy.json. `media verify --remote --public` checks
  # all bytes (SHA-256, size, MIME), not merely a HEAD 200 response.
  # See MEDIA-INGESTION.md. Transfer neither approves nor publishes a post.
  media_url_base: ""

tiktok:
  # Filled automatically by `socialcli auth tiktok`, which requests
  # user.info.basic and reads open_id from the token exchange response
  # without additional calls. If unavailable (for example, with an older
  # token lacking that scope), the command warns you to fill it manually.
  # See SETUP.md, TikTok section. Request:
  # GET https://open.tiktokapis.com/v2/user/info/?fields=open_id
  # with 'Authorization: Bearer <access_token>' using the token stored
  # by `socialcli auth tiktok` in .secrets/tiktok.json.
  open_id: ""
  # inbox  -> upload to inbox; you finish publishing in the app
  # direct -> automatic publication ONLY after TikTok audit approval and
  #           completion of required UX controls; see docs/tiktok-review.md
  mode: inbox
  auditada: false
