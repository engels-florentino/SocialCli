<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your SocialCli sign-in code</title></head>
<body style="margin:0;padding:32px 16px;background:var(--background);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<table role="presentation" style="width:100%;max-width:520px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px"><tr><td style="padding:32px">
<p style="color:var(--blue);font-size:22px;font-weight:700;margin:0 0 28px">SocialCli</p>
<h1 style="font-size:28px;line-height:1.2">Your sign-in code</h1>
<p style="color:var(--muted);line-height:1.65">Enter this code in the SocialCli page you opened. It expires in 10 minutes.</p>
<p style="color:var(--blue);font-size:34px;letter-spacing:6px;font-weight:700">{{ .Token }}</p>
<p style="color:var(--muted);font-size:13px;line-height:1.65">If you didn't request this code, you can ignore this email. Never share your code with an assistant or anyone else.</p>
<p style="border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:12px">Your accounts. Your permissions. Your choice.</p>
</td></tr></table></body></html>
