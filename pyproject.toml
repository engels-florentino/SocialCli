[project]
name = "socialcli"
version = "0.1.0"
description = "SocialCli: publish and manage creator-owned social content from the terminal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
socialcli = "socialctl.cli:app"
socialctl = "socialctl.cli:app"

[project.urls]
Homepage = "https://engels-florentino.github.io/SocialCli/"
Repository = "https://github.com/engels-florentino/SocialCli"
Issues = "https://github.com/engels-florentino/SocialCli/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socialctl"]
