# Keep these exact-location guards on EVERY public hostname that can reach the
# connection service after commercial cutover. They survive application rollback.
# Install at the reviewed cutover; existing polls/completion/token routes drain
# through the enumerated server policy. Nginx matches a normalized URI here.
location = /v1/authorizations {
    default_type application/json;
    return 410 '{"detail":"upgrade_required: Install the current SocialCli and sign in."}';
}
location = /v1/authorizations/ {
    default_type application/json;
    return 410 '{"detail":"upgrade_required: Install the current SocialCli and sign in."}';
}
