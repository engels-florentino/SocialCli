# Add to the pilot host's persistent Advanced configuration, before regeneration.
location = /monitoring/backup {
    set $backup_health_upstream socialcli-backup-health:8790;
    proxy_pass http://$backup_health_upstream;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
}
