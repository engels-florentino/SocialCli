# Install at socialcli-saas-candidate-backup.service.d/drive-copy.conf
# OAuth config must exist, root:root 0600, in root:root 0700 drive directory.
[Service]
ReadWritePaths=/home/blades3/projects/socialcli-saas/private/drive
TimeoutStartSec=1800
ExecStartPost=/usr/bin/rclone copy /home/blades3/projects/socialcli-saas/backups/repository-candidate-data socialcli_backup:SocialCli-Backups/candidate/data --config /home/blades3/projects/socialcli-saas/private/drive/rclone.conf --transfers 4 --checkers 4 --checksum
ExecStartPost=/usr/bin/rclone check /home/blades3/projects/socialcli-saas/backups/repository-candidate-data socialcli_backup:SocialCli-Backups/candidate/data --config /home/blades3/projects/socialcli-saas/private/drive/rclone.conf --one-way
ExecStartPost=/usr/bin/rclone copy /home/blades3/projects/socialcli-saas/private/recovery-repository-candidate socialcli_backup:SocialCli-Backups/candidate/recovery --config /home/blades3/projects/socialcli-saas/private/drive/rclone.conf --transfers 4 --checkers 4 --checksum
ExecStartPost=/usr/bin/rclone check /home/blades3/projects/socialcli-saas/private/recovery-repository-candidate socialcli_backup:SocialCli-Backups/candidate/recovery --config /home/blades3/projects/socialcli-saas/private/drive/rclone.conf --one-way
ExecStartPost=/usr/bin/python3 /home/blades3/projects/socialcli-saas/ops/backup_alert.py /home/blades3/projects/socialcli-saas/private/backup-candidate.json --remote-complete
