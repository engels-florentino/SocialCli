name: socialcli-backup-health
services:
  health:
    image: ${SOCIALCLI_CANDIDATE_IMAGE:?Use the reviewed existing Python runtime image}
    container_name: socialcli-backup-health
    user: '65534:65534'
    entrypoint: ['python', '/monitor/backup_health.py', '/status/backup.json', '--bind', '0.0.0.0']
    restart: unless-stopped
    volumes:
      - ./backup_health.py:/monitor/backup_health.py:ro
      - /var/lib/socialcli-backup-health:/status:ro
    networks: [proxy]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 48m
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
networks:
  proxy:
    external: true
    name: nginx-proxy-manager_default
