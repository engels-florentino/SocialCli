# Insert inside ONLY the social.florentino.pro TLS server block.
# Persist this through the proxy manager's Advanced configuration.
# OAuth callbacks carry single-use codes: never log their query strings.
location ~ ^/(?:v1|oauth|connect)(?:/|$)|^/healthz$ {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16k;
    proxy_set_header Host social.florentino.pro;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_pass http://socialcli-connections:8787;
}
