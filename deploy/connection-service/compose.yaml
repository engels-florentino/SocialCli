services:
  connections:
    build:
      context: .
      dockerfile: Dockerfile
    image: socialcli-connections:local
    container_name: socialcli-connections
    restart: unless-stopped
    env_file: service.env
    environment:
      SOCIALCLI_BIND: 0.0.0.0
      SOCIALCLI_DATABASE: /data/connections.sqlite3
    volumes:
      - ./state:/data
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  proxy:
    external: true
    name: nginx-proxy-manager_default
